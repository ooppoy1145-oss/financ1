<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Finance Pro — แอดมินหลังบ้าน</title>
  <meta name="description" content="ระบบจัดการลูกค้าและสัญญาไฟแนนซ์ สำหรับผู้ดูแลระบบ">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
</head>
<body>
  <div class="admin-page">
    <!-- Header -->
    <header class="admin-header" id="adminHeader"></header>

    <div class="container-wide">
      <!-- Live Sync Status Banner -->
      <div id="adminSyncStatus"></div>

      <!-- Stats -->
      <div class="admin-stats" id="adminStats"></div>

      <!-- Toolbar -->
      <div class="admin-toolbar" id="adminToolbar"></div>

      <!-- Customer List -->
      <div class="customer-list" id="customerList"></div>
    </div>
  </div>

  <!-- Customer Modal -->
  <div class="modal-overlay admin-modal" id="customerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">เพิ่มลูกค้า</h3>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Contract Modal -->
  <div class="modal-overlay admin-modal" id="contractModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">เพิ่มสัญญา</h3>
        <button class="modal-close" onclick="closeContractModal()">✕</button>
      </div>
      <div class="modal-body"></div>
    </div>
  </div>

  <!-- Summary Dashboard Modal (3. แดชบอร์ดสรุปยอด รายวัน, รายสัปดาห์, รายเดือน) -->
  <div class="modal-overlay admin-modal" id="summaryDashboardModal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:1.3rem;">📊</span>
          <h3 class="modal-title">แดชบอร์ดสรุปยอดค่างวดลูกค้า</h3>
        </div>
        <button class="modal-close" onclick="closeSummaryDashboardModal()">✕</button>
      </div>
      <div class="modal-body" id="summaryDashboardBody"></div>
    </div>
  </div>

  <!-- Customer Quick Status Modal (3.3 ดูสถานะว่าลูกค้าจ่ายมาแล้วหรือยัง) -->
  <div class="modal-overlay admin-modal" id="customerQuickStatusModal">
    <div class="modal-content" style="max-width:440px;">
      <div class="modal-header">
        <h3 class="modal-title" id="quickStatusTitle">สถานะการชำระเงิน</h3>
        <button class="modal-close" onclick="closeQuickStatusModal()">✕</button>
      </div>
      <div class="modal-body" id="quickStatusBody"></div>
    </div>
  </div>

  <!-- Settings Modal (5. รูป QR ของร้าน, 6. Bank API, LINE, ข้อมูลติดต่อ) -->
  <div class="modal-overlay admin-modal" id="settingsModal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3 class="modal-title">⚙️ ตั้งค่าระบบ, ข้อมูลติดต่อ, QR ร้าน & Bank API</h3>
        <button class="modal-close" onclick="closeSettingsModal()">✕</button>
      </div>
      <div class="modal-body" id="settingsModalBody"></div>
    </div>
  </div>

  <!-- Sync & Transfer Modal (สำหรับส่งข้อมูลจากคอมพิวเตอร์ไปมือถือ) -->
  <div class="modal-overlay admin-modal" id="syncTransferModal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:1.3rem;">📲</span>
          <h3 class="modal-title">ส่งข้อมูลไปมือถือ & ซิงค์ข้ามอุปกรณ์</h3>
        </div>
        <button class="modal-close" onclick="closeSyncTransferModal()">✕</button>
      </div>
      <div class="modal-body" id="syncTransferBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/bank-api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
